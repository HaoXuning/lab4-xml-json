<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Catalog - XML Display</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .book-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }
        .book-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #2c3e50;
        }
        .price {
            color: #e74c3c;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Book Catalog</h1>
    <div id="bookList"></div>
    <script>
        fetch("book.xml")
            .then(response => response.text())
            .then(xmlText => {
                let parser = new DOMParser();
                let xmlDoc = parser.parseFromString(xmlText, "text/xml");
                let books = xmlDoc.getElementsByTagName("book");
                let outputHtml = "";
                for (let i = 0; i < books.length; i++) {
                    let id = books[i].getAttribute("id");
                    let title = books[i].getElementsByTagName("title")[0].textContent;
                    let author = books[i].getElementsByTagName("author")[0].textContent;
                    let price = books[i].getElementsByTagName("price")[0].textContent;

                    outputHtml += `
                    <div class="book-item">
                        <div class="book-title">[ID: ${id}] ${title}</div>
                        <div>Author: ${author}</div>
                        <div class="price">Price: $${price}</div>
                    </div>
                    `;
                }
                document.getElementById("bookList").innerHTML = outputHtml;
            })
            .catch(error => {
                document.getElementById("bookList").innerHTML = 
                    "<p style='color:red'>无法加载 XML，请使用 Live Server 打开页面。</p>";
            });
    </script>
</body>
</html>
